name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; jobs that need more declare it themselves.
# Every `uses:` is pinned to a full commit SHA with the tag in a trailing comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, guards, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # check:ids compares against origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Lesson ids (published ids must not disappear)
        run: npm run check:ids
      - name: Theme guard (no hex colours, no left accent stripes)
        run: npm run check:theme
      - name: Unit tests (node:test)
        run: npm run test:unit
      - name: Legal pages match stored data and browser storage keys
        run: npm run check:legal
      - run: npm run check:learning
      - run: npm run check:curriculum
      - run: npm run check:set-values
      - run: npm run build
        env:
          # The build must not need a live database; adjust if prerendering requires one.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: baremetal
          TRUSTED_PROXY_HOPS: 1
          RUNNER_SOCKET: /tmp/bm-build.sock

  supply-chain:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, full history)
        # Pinned release binary instead of a third-party action, checked against the published sha256.
        run: |
          set -eu
          v=8.21.2
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  verify-content:
    name: Verify lesson content (compilers, bubblewrap, qemu)
    runs-on: ubuntu-24.04
    # The content verifier is required; enable user namespaces below for bubblewrap.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/toolchains
      - run: npm ci
      - name: Warm the Go build cache (needs bubblewrap with --tmp-overlay)
        run: |
          if bwrap --help 2>&1 | grep -q -- --tmp-overlay; then
            mkdir -p "$RUNNER_TEMP/gocache"
            echo "GO_CACHE_SEED=$RUNNER_TEMP/gocache" >> "$GITHUB_ENV"
            GO_CACHE_SEED="$RUNNER_TEMP/gocache" npx tsx scripts/warm-go-cache.mts
          else
            echo "bubblewrap lacks --tmp-overlay; Go compiles run without a warm cache"
          fi
      - run: npm run verify:content
      - run: npm run check:stdout-order

      - name: Reject forged verdicts and harness disclosure
        run: node --import tsx scripts/security/integrity/fixtures-forgery.mts
      - name: Sandbox escape regressions (fork bomb, memory bomb, egress, /proc, includes, build scripts, cgo)
        run: node --conditions=react-server --import tsx scripts/security/sandbox-escape.mts
      - name: Harness-disclosure probes (offline)
        run: node --import tsx scripts/security/audit-checks.mts
      - name: Reference-cache cancellation
        run: node --import tsx scripts/security/runner-cancellation.mts
      - name: Runner socket integration (all languages)
        run: npm run test:runner

  regressions:
    name: Auth, budgets, API and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/toolchains
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Session rotation and lifetime limits
        run: npm run test:sessions
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: bm_ci_sessions
      - run: npm run test:regressions
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
