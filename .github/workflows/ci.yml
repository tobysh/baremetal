name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, guards, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:ids compares against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Lesson ids (published ids must not disappear)
        run: npm run check:ids
      - name: Theme guard (no hex colours, no left accent stripes)
        run: npm run check:theme
      - run: npm run build
        env:
          # The build must not need a live database; adjust if prerendering requires one.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: baremetal

  verify-content:
    name: Verify lesson content (compilers, bubblewrap, qemu)
    runs-on: ubuntu-24.04
    # The content verifier is required; enable user namespaces below for bubblewrap.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make bubblewrap qemu-system-x86 rustc
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run verify:content
