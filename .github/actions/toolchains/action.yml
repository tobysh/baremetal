name: Runner toolchains
description: Install compilers and enable Bubblewrap on disposable Ubuntu workers
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.27.3' # the version the curriculum was verified with
    - name: Install compilers and sandbox tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make bubblewrap qemu-system-x86
        echo "GO_TOOLCHAIN_DIR=$(go env GOROOT)" >> "$GITHUB_ENV"
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install pinned Rust (rustup, minimal profile)
      shell: bash
      env:
        RUST_VERSION: '1.99.1' # the version the curriculum was verified with (offset_of! needs 1.77+)
        RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 # published rustup-init.sha256 (x86_64-unknown-linux-gnu)
      run: |
        set -eu
        export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo"
        curl -sSfL -o "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
        echo "${RUSTUP_INIT_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/rustup-init"
        "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain "$RUST_VERSION"
        echo "RUST_TOOLCHAIN_DIR=$RUSTUP_HOME/toolchains/${RUST_VERSION}-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
