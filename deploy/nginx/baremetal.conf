# Reverse proxy template for the Baremetal web app (Next.js on 127.0.0.1:3000).
# Copy to /etc/nginx/sites-available/, replace the server_name and certificate paths, and set
# TRUSTED_PROXY_HOPS=1 in /etc/baremetal/web.env. Details: docs/deployment-hardening.md ("Proxy contract").
#
# The rules that matter for security:
#  - X-Forwarded-For is OVERWRITTEN with the TCP peer address, never appended to
#    ($proxy_add_x_forwarded_for would keep client-supplied entries and defeat per-IP limits).
#  - X-Forwarded-Host and X-Real-IP from the client are discarded.
#  - Behind a CDN, restore the real client address first (ngx_http_realip_module with the CDN's published ranges,
#    `real_ip_header` set to the CDN's client-IP header) so $remote_addr is the visitor, and keep TRUSTED_PROXY_HOPS=1.

upstream baremetal_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Per-address connection and request caps in front of the app (the app has its own, finer limits).
limit_conn_zone $binary_remote_addr zone=bm_conn:10m;
limit_req_zone  $binary_remote_addr zone=bm_req:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 256k;      # the largest API body is far below this
    client_header_timeout 15s;
    client_body_timeout 15s;
    limit_conn bm_conn 40;
    limit_req  zone=bm_req burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy comes from the app: pages carry a per-request nonce (src/proxy.ts).
    # Do not add a CSP here (a second header is enforced as well) and do not proxy_cache HTML pages.

    location / {
        proxy_pass http://baremetal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, do not append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Real-IP         "";
        proxy_read_timeout 120s;
    }

    # Interactive shell: the session token is part of the URL (/api/shell/<token>/input), so these requests are never
    # written to the access log. ^~ wins over the regex below. Output is server-sent events: no buffering.
    location ^~ /api/shell/ {
        access_log off;
        proxy_pass http://baremetal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Real-IP         "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Server-sent events (tutor streaming; POST /api/shell, which carries no token): no buffering.
    location ~ ^/api/(tutor|shell) {
        proxy_pass http://baremetal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Real-IP         "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
