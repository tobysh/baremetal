# Drop-in for baremetal-web.service on a host that serves the interactive shell. install-host.sh installs it as
# /etc/systemd/system/baremetal-web.service.d/shell-client.conf when baremetal-web.service is present; do not add the
# group to baremetal-web.service itself, because a unit naming a group that does not exist fails to start on hosts
# without the shell. SupplementaryGroups= in a drop-in adds to the unit's list (baremetal-exec stays).
[Service]
# The broker socket is 0660 baremetal-shell-broker:baremetal-shell-client; this group is the only way in.
SupplementaryGroups=baremetal-shell-client
Environment=SHELL_BROKER_SOCKET=/run/baremetal-shell-broker/broker.sock
