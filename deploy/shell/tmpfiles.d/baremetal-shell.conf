# Socket directories for the shell services. Installed to /etc/tmpfiles.d/baremetal-shell.conf by install-host.sh.
# Type Path                          Mode  User                     Group                  Age Argument
# Launcher socket: only the broker (group baremetal-shell-launch) may connect. Nothing else may even traverse it.
d      /run/baremetal-shell          0750  root                     baremetal-shell-launch -
# Broker socket: only the web service (group baremetal-shell-client) may connect.
d      /run/baremetal-shell-broker   0750  baremetal-shell-broker   baremetal-shell-client -
